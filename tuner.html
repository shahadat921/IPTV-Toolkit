<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuner — M3U Playlist Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10;
    --panel:#12151C;
    --panel-2:#191D26;
    --line:#242A36;
    --text:#E8EAED;
    --muted:#7C8493;
    --accent:#FF5A36;
    --accent-2:#2DD4BF;
    --mono:'JetBrains Mono', monospace;
    --display:'Space Grotesk', sans-serif;
    --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    display:flex;
    flex-direction:column;
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
  }
  a{color:var(--accent-2);}
  button, .channel-item{
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }

  /* ---- Topbar ---- */
  header.topbar{
    position:relative;
    border-bottom:1px solid var(--line);
    background:var(--panel);
    padding:18px 20px 16px;
    padding-left:max(20px, env(safe-area-inset-left));
    padding-right:max(20px, env(safe-area-inset-right));
    padding-top:max(18px, env(safe-area-inset-top));
    overflow:hidden;
  }
  header.topbar::after{
    content:"";
    position:absolute; left:0; right:0; top:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--accent) 20%, var(--accent-2) 50%, transparent 80%);
    background-size:200% 100%;
    animation:scan 5s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ header.topbar::after{animation:none;} }
  @keyframes scan{ from{background-position:0% 0;} to{background-position:-200% 0;} }

  .brand{
    font-family:var(--display);
    font-weight:700;
    font-size:20px;
    letter-spacing:0.06em;
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:14px;
  }
  .brand span.dot{color:var(--accent);}
  .brand small{
    font-family:var(--mono);
    font-weight:400;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.04em;
  }

  form#loadForm{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  input[type="text"], textarea{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:10px 12px;
    font-family:var(--mono);
    font-size:13px;
  }
  input[type="text"]:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--accent-2);
    outline-offset:1px;
  }
  #m3uUrl{flex:1; min-width:200px;}
  button{
    font-family:var(--body);
    font-weight:600;
    font-size:13px;
    border:none;
    border-radius:6px;
    padding:10px 16px;
    cursor:pointer;
  }
  button.primary{background:var(--accent); color:#1A0A05;}
  button.primary:hover{background:#ff6f4a;}
  button.ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
  }
  button.ghost:hover{color:var(--text); border-color:var(--accent-2);}

  textarea#rawM3u{
    width:100%;
    margin-top:10px;
    min-height:90px;
    resize:vertical;
    display:none;
  }
  .toggle-row{margin-top:10px; display:flex; gap:8px; align-items:center;}

  .status{
    font-family:var(--mono);
    font-size:12px;
    margin-top:10px;
    color:var(--muted);
  }
  .status.error{color:var(--accent);}
  .status.ok{color:var(--accent-2);}

  /* ---- Layout ---- */
  .layout{
    flex:1;
    display:flex;
    flex-direction:row;
    min-height:0;
  }
  @media (max-width:760px){
    .layout{flex-direction:column;}
    .screen{order:1; padding:12px 12px 6px; flex:none;}
    .crt{flex:none; aspect-ratio:16/9; min-height:0;}
    .channel-rail{
      order:2;
      width:100% !important;
      max-height:none;
      flex:1;
      border-right:none;
      border-top:1px solid var(--line);
      padding-bottom:max(10px, env(safe-area-inset-bottom));
    }
    .now-playing{margin-bottom:4px;}
    #m3uUrl, textarea#rawM3u, #searchInput{font-size:16px;}
    button{padding:12px 16px; font-size:14px;}
    button.ghost{width:100%;}
    form#loadForm{flex-direction:column;}
    #m3uUrl{min-width:0;}
    form#loadForm button.primary{width:100%;}
    .channel-item{padding:11px 8px; min-height:44px;}
    .ch-name{font-size:14px;}
  }

  .channel-rail{
    width:320px;
    flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--line);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:10px;
  }
  .rail-search{
    width:100%;
    margin-bottom:8px;
    position:sticky;
    top:0;
    z-index:1;
    background:var(--panel);
  }
  .rail-empty{
    color:var(--muted);
    font-size:13px;
    padding:24px 10px;
    text-align:center;
    line-height:1.5;
  }
  .rail-group-label{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--muted);
    padding:10px 6px 4px;
  }
  .channel-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    background:transparent;
    border:1px solid transparent;
    border-left:3px solid transparent;
    border-radius:4px;
    padding:8px 8px;
    margin-bottom:2px;
    color:var(--text);
    text-align:left;
  }
  .channel-item:hover{background:var(--panel-2);}
  .channel-item:active{background:var(--panel-2); opacity:0.85;}
  .channel-item.active{
    background:var(--panel-2);
    border-left-color:var(--accent);
  }
  .ch-num{
    font-family:var(--mono);
    font-size:12px;
    color:var(--accent-2);
    width:22px;
    flex-shrink:0;
  }
  .ch-logo{
    width:26px; height:26px;
    border-radius:4px;
    object-fit:cover;
    flex-shrink:0;
    background:var(--panel-2);
  }
  .ch-logo.placeholder{display:inline-block;}
  .ch-name{
    font-size:13px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* ---- Screen ---- */
  .screen{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:18px;
    min-width:0;
  }
  .crt{
    position:relative;
    flex:1;
    background:#000;
    border-radius:10px;
    border:1px solid var(--line);
    box-shadow: inset 0 0 60px rgba(0,0,0,0.6);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:240px;
  }
  video{width:100%; height:100%; object-fit:contain; background:#000;}
  .no-signal{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:0.15em;
    color:var(--muted);
  }
  .now-playing{
    margin-top:12px;
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
  }
  .now-playing strong{color:var(--text); font-family:var(--body); font-size:14px;}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot">●</span> TUNER <small>m3u / hls playlist player</small></div>
  <form id="loadForm">
    <input type="text" id="m3uUrl" placeholder="Paste an m3u / m3u8 playlist URL…" autocomplete="off">
    <button type="submit" class="primary">Load</button>
  </form>
  <div class="toggle-row">
    <button type="button" class="ghost" id="pasteToggle">Paste raw playlist instead</button>
  </div>
  <textarea id="rawM3u" placeholder="#EXTM3U
#EXTINF:-1,Channel name
https://example.com/stream.m3u8"></textarea>
  <button type="button" class="ghost" id="parseRawBtn" style="display:none; margin-top:8px;">Parse pasted playlist</button>
  <div class="status" id="statusMsg"></div>
</header>

<div class="layout">
  <aside class="channel-rail" id="channelRail">
    <input type="text" id="searchInput" class="rail-search" placeholder="Filter channels…" style="display:none;">
    <div class="rail-empty">No playlist loaded yet. Paste an m3u URL above, or use "Paste raw playlist" if the link can't be fetched directly (CORS).</div>
  </aside>

  <section class="screen">
    <div class="crt">
      <video id="player" controls playsinline></video>
      <div class="no-signal" id="noSignal">NO SIGNAL</div>
    </div>
    <div class="now-playing" id="nowPlaying"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
let channels = [];
let hls = null;
let activeBtn = null;

const railEl = document.getElementById('channelRail');
const searchInput = document.getElementById('searchInput');
const statusMsg = document.getElementById('statusMsg');
const rawArea = document.getElementById('rawM3u');
const pasteToggle = document.getElementById('pasteToggle');
const parseRawBtn = document.getElementById('parseRawBtn');
const video = document.getElementById('player');
const noSignal = document.getElementById('noSignal');
const nowPlaying = document.getElementById('nowPlaying');

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function setStatus(msg, type){
  statusMsg.textContent = msg || '';
  statusMsg.className = 'status' + (type ? ' ' + type : '');
}

function parseM3U(text){
  const lines = text.split(/\r?\n/);
  const result = [];
  let current = null;
  for (let raw of lines){
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF')){
      const nameMatch = line.match(/,(.*)$/);
      const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
      const groupMatch = line.match(/group-title="([^"]*)"/i);
      current = {
        name: nameMatch ? nameMatch[1].trim() : 'Unnamed channel',
        logo: logoMatch ? logoMatch[1] : null,
        group: groupMatch ? groupMatch[1] : 'General'
      };
    } else if (!line.startsWith('#')){
      if (current){
        current.url = line;
        result.push(current);
        current = null;
      } else {
        result.push({ name: 'Channel ' + (result.length + 1), url: line, group: 'General', logo: null });
      }
    }
  }
  return result;
}

function renderChannels(filter){
  filter = (filter || '').toLowerCase();
  railEl.innerHTML = '';
  railEl.appendChild(searchInput);

  if (!channels.length){
    const empty = document.createElement('div');
    empty.className = 'rail-empty';
    empty.textContent = 'No playlist loaded yet. Paste an m3u URL above, or use "Paste raw playlist" if the link can\'t be fetched directly (CORS).';
    railEl.appendChild(empty);
    searchInput.style.display = 'none';
    return;
  }

  searchInput.style.display = 'block';
  const filtered = channels.filter(c => c.name.toLowerCase().includes(filter));
  const order = [];
  const grouped = {};
  filtered.forEach(c => {
    const g = c.group || 'General';
    if (!grouped[g]){ grouped[g] = []; order.push(g); }
    grouped[g].push(c);
  });

  let counter = 0;
  order.forEach(g => {
    const label = document.createElement('div');
    label.className = 'rail-group-label';
    label.textContent = g;
    railEl.appendChild(label);

    grouped[g].forEach(c => {
      counter++;
      const num = String(counter).padStart(2, '0');
      const btn = document.createElement('button');
      btn.className = 'channel-item';
      const logoHtml = c.logo
        ? `<img class="ch-logo" src="${escapeHtml(c.logo)}" alt="" onerror="this.style.visibility='hidden'">`
        : `<span class="ch-logo placeholder"></span>`;
      btn.innerHTML = `<span class="ch-num">${num}</span>${logoHtml}<span class="ch-name">${escapeHtml(c.name)}</span>`;
      btn.addEventListener('click', () => playChannel(c, btn));
      railEl.appendChild(btn);
    });
  });
}

function playChannel(channel, btnEl){
  if (activeBtn) activeBtn.classList.remove('active');
  if (btnEl){ btnEl.classList.add('active'); activeBtn = btnEl; }

  noSignal.style.display = 'none';
  if (hls){ hls.destroy(); hls = null; }

  const isM3U8 = /\.m3u8(\?.*)?$/i.test(channel.url);

  if (isM3U8 && video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = channel.url;
  } else if (isM3U8 && window.Hls && Hls.isSupported()){
    hls = new Hls();
    hls.loadSource(channel.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.ERROR, (evt, data) => {
      if (data.fatal) setStatus('Playback error: ' + (data.details || 'stream failed to load'), 'error');
    });
  } else {
    video.src = channel.url;
  }

  video.play().catch(() => {});
  nowPlaying.innerHTML = `<strong>${escapeHtml(channel.name)}</strong> &nbsp; ${escapeHtml(channel.group || '')}`;
}

function handlePlaylistText(text){
  const parsed = parseM3U(text);
  if (!parsed.length){
    setStatus('No channels found — check the playlist format.', 'error');
    return;
  }
  channels = parsed;
  renderChannels('');
  setStatus(`Loaded ${channels.length} channel${channels.length === 1 ? '' : 's'}.`, 'ok');
}

document.getElementById('loadForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = document.getElementById('m3uUrl').value.trim();
  if (!url) return;
  setStatus('Fetching playlist…');
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    handlePlaylistText(text);
  } catch (err){
    setStatus('Could not fetch that URL directly (often a CORS restriction). Use "Paste raw playlist" below instead.', 'error');
    rawArea.style.display = 'block';
    parseRawBtn.style.display = 'inline-block';
  }
});

pasteToggle.addEventListener('click', () => {
  const showing = rawArea.style.display === 'block';
  rawArea.style.display = showing ? 'none' : 'block';
  parseRawBtn.style.display = showing ? 'none' : 'inline-block';
});

parseRawBtn.addEventListener('click', () => {
  const text = rawArea.value.trim();
  if (!text){ setStatus('Paste playlist text first.', 'error'); return; }
  handlePlaylistText(text);
});

searchInput.addEventListener('input', () => renderChannels(searchInput.value));

renderChannels('');
</script>
</body>
</html>
